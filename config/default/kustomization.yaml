apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudnative-cluster-api-provider-cce-system
resources:
  - namespace.yaml
  - ../crd
  - ../rbac
  - ../manager
  # Webhook resources (configurations + service). The serving certificate is
  # delivered by cert-manager (../certmanager): the webhook configs carry the
  # cert-manager.io/inject-ca-from annotation so caBundle is injected, and the
  # deployment's webhook-service-cert Secret is signed automatically.
  - ../certmanager
  - ../webhook
