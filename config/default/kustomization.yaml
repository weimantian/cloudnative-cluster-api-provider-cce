apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cce-provider-system
resources:
  - namespace.yaml
  - ../crd
  - ../rbac
  - ../manager
  # Webhook resources (configurations + service). Certificate delivery is
  # deployment-specific: install cert-manager for automatic injection, or
  # pre-create the webhook-service-cert Secret and inject caBundle (see the
  # clusterctl deployment guide).
  - ../webhook
