# The following patch enables the conversion webhook for this CRD
# (v1beta1 <-> v1beta2; v1beta2 is the storage version).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cceclustertemplates.infrastructure.cluster.x-k8s.io
spec:
  conversion:
    strategy: Webhook
    webhook:
      conversionReviewVersions: ["v1", "v1beta1"]
      clientConfig:
        service:
          namespace: cce-provider-system
          name: webhook-service
          path: /convert
