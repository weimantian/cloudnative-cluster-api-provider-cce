                              description: |-
                                PolicyType is the permission level: CCEClusterAdminPolicy (cluster
                                admin), CCEAdminPolicy (ops), CCEEditPolicy (developer),
                                CCEViewPolicy (read-only).
                              enum:
                              - CCEClusterAdminPolicy
                              - CCEAdminPolicy
                              - CCEEditPolicy
                              - CCEViewPolicy
                              type: string
                            principalIds:
                              description: PrincipalIds are the IAM user/group/agency
                                IDs the policy applies to.
