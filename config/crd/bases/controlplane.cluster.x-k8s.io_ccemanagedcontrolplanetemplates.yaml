                            namespace:
                              description: Namespace of the ServiceAccount (immutable
                                per association).
                              type: string
                            serviceAccount:
                              description: ServiceAccount name (one association per
                                ServiceAccount).
                              type: string
                          required:
                          - agencyName
                          - namespace
                          - serviceAccount
                          type: object
                        type: array
                      serviceNetwork:
                        description: ServiceNetwork of the cluster.
                        properties:
                          cidr:
                            description: CIDR of the service network.
                            type: string
                        type: object
                      version:
                        description: Version of Kubernetes, e.g. "v1.30.0". Empty
                          means CCE latest.
                        type: string
                    required:
                    - clusterName
                    type: object
                required:
                - spec
                type: object
            required:
            - template
            type: object
        type: object
    served: true
    storage: false
