  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: ccemanagedcontrolplanes.controlplane.cluster.x-k8s.io
spec:
  group: controlplane.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: CCEManagedControlPlane
    listKind: CCEManagedControlPlaneList
    plural: ccemanagedcontrolplanes
    singular: ccemanagedcontrolplane
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Cluster to which this CCEManagedControlPlane belongs
      jsonPath: .metadata.labels.cluster\.x-k8s\.io/cluster-name
      name: Cluster
      type: string
    - description: Control plane ready
      jsonPath: .status.ready
      name: Ready
      type: string
    - description: kubeconfig generated
      jsonPath: .status.initialized
      name: Initialized
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          CCEManagedControlPlane is the Schema for the CCE managed control plane
          (ControlPlane).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CCEManagedControlPlaneSpec defines the desired state of
              CCEManagedControlPlane. It maps to the CCE CreateCluster API (ClusterSpec):
              category / flavor / version / containerNetwork / serviceNetwork /
              customSan / publicAccess / agencyName / billingMode.
            properties:
              agencyName:
                description: AgencyName used by the cluster (1.27+; empty uses the
                  system agency).
                type: string
              billing:
                description: 'Billing controls billing mode: 0=on-demand, 1=subscription.'
                properties:
                  mode:
                    default: 0
                    description: 'Mode: 0=on-demand, 1=subscription.'
                    enum:
                    - 0
                    - 1
                    format: int32
                    type: integer
                type: object
              category:
                default: Turbo
                description: 'Category of the CCE cluster: CCE (Standard) or Turbo.'
                enum:
                - CCE
                - Turbo
                type: string
              clusterName:
                description: ClusterName of the owning CCE cluster.
                type: string
              containerNetwork:
                description: ContainerNetwork of the cluster.
                properties:
                  cidr:
                    description: CIDR of the container network (immutable after creation
                      for tunnel mode).
                    type: string
                  eniSubnets:
                    description: ENISubnets for eni mode (Turbo).
                    items:
                      type: string
                    type: array
                  mode:
                    default: eni
                    description: 'Mode: overlay_l2 | vpc-router | eni (eni implies
                      Turbo).'
                    enum:
                    - overlay_l2
                    - vpc-router
                    - eni
                    type: string
                type: object
              controlPlaneEndpoint:
                description: |-
                  ControlPlaneEndpoint is the API server endpoint (backfilled by the
                  provider from ShowClusterEndpoints). Pointer so an empty value is
                  omitted (the embedded APIEndpoint schema requires >=1 property).
                minProperties: 1
                properties:
                  host:
                    description: host is the hostname on which the API server is serving.
                    maxLength: 512
                    minLength: 1
                    type: string
                  port:
                    description: port is the port on which the API server is serving.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                type: object
              customSan:
                description: CustomSan entries for the API server certificate.
                items:
                  type: string
                type: array
              endpointAccess:
                description: EndpointAccess controls public API server access.
                properties:
                  public:
                    description: Public enables public API server access.
                    type: boolean
                type: object
              flavor:
                description: Flavor of the cluster (official enum e.g. cce.s1.small
                  ... cce.s2.xlarge).
                type: string
              serviceNetwork:
                description: ServiceNetwork of the cluster.
                properties:
                  cidr:
                    description: CIDR of the service network.
                    type: string
                type: object
              version:
                description: Version of Kubernetes, e.g. "v1.30.0". Empty means CCE
                  latest.
                type: string
            required:
            - clusterName
            type: object
          status:
            description: |-
              CCEManagedControlPlaneStatus defines the observed state of
              CCEManagedControlPlane.
            properties:
              clusterID:
                description: ClusterID is the CCE cluster UUID.
                type: string
              conditions:
                description: Conditions defines current service state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              controlPlaneEndpoint:
                description: ControlPlaneEndpoint is the API server endpoint.
                minProperties: 1
                properties:
                  host:
                    description: host is the hostname on which the API server is serving.
                    maxLength: 512
                    minLength: 1
                    type: string
                  port:
                    description: port is the port on which the API server is serving.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                type: object
              failureMessage:
                description: FailureMessage is a human-readable failure description.
                type: string
              failureReason:
                description: FailureReason is a short reason for failure.
                type: string
              initialized:
                description: Initialized indicates the kubeconfig Secret has been
                  generated.
                type: boolean
              kubeconfigSecretName:
                description: KubeconfigSecretName of the generated kubeconfig Secret.
                type: string
              ready:
                description: Ready indicates the CCE control plane is available.
                type: boolean
              version:
                description: Version of the cluster as reported by CCE.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
