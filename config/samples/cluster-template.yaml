# Example workload cluster manifest for cloudnative-cluster-api-provider-cce.
# Requires a management cluster with CAPI and this provider installed, plus a
# credentials Secret <cluster>-credentials (keys accessKey/secretKey) or the
# CLOUD_SDK_AK/CLOUD_SDK_SK environment fallback (see deploy/variables.md).
#
# NOTE: values marked "VERIFY" are subject to the Huawei Cloud CCE alignment
# questionnaire (docs/cce-verification-questionnaire.md) — confirm before
# production use.
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: my-cce-cluster
  namespace: default
spec:
  clusterNetwork:
    pods:
      cidrBlocks: ["10.244.0.0/16"]
    services:
      cidrBlocks: ["10.247.0.0/16"]
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: CCECluster
    name: my-cce-cluster
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    kind: CCEManagedControlPlane
    name: my-cce-cluster-control-plane
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: CCECluster
metadata:
  name: my-cce-cluster
  namespace: default
spec:
  region: cn-north-4
  network:
    vpc:
      id: VERIFY-VPC-ID # an existing VPC is required before cluster creation
    subnets:
      - id: VERIFY-SUBNET-ID
        availabilityZone: cn-north-4a
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: CCEManagedControlPlane
metadata:
  name: my-cce-cluster-control-plane
  namespace: default
spec:
  clusterName: my-cce-cluster
  category: Turbo # CCE | Turbo (Turbo recommended, aligned with EKS-managed)
  version: "v1.30.0" # VERIFY: supported versions
  flavor: cce.s2.medium # VERIFY: flavor availability per region
  containerNetwork:
    mode: eni # overlay_l2 | vpc-router | eni (eni implies Turbo)
    cidr: 10.244.0.0/16
    eniSubnets: # VERIFY (Turbo/eni): ENI subnets covering required AZs
      - VERIFY-ENI-SUBNET-ID
  serviceNetwork:
    cidr: 10.247.0.0/16
  endpointAccess:
    public: true
  billing:
    mode: 0 # 0=on-demand
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachinePool
metadata:
  name: my-cce-cluster-pool-0
  namespace: default
spec:
  clusterName: my-cce-cluster
  replicas: 3
  template:
    spec:
      clusterName: my-cce-cluster
      version: v1.30.0
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: CCEManagedMachinePool
        name: my-cce-cluster-pool-0
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: CCEManagedMachinePool
metadata:
  name: my-cce-cluster-pool-0
  namespace: default
spec:
  clusterName: my-cce-cluster
  nodePoolName: pool-0
  flavor: c7.large.2 # VERIFY: flavor availability
  os: HuaweiCloudEulerOS2.0
  rootVolume:
    size: 40
    type: GPSSD
  sshKey: VERIFY-KEYPAIR-NAME
  availabilityZone: cn-north-4a
  replicas: 3
  billingMode: 0
