# clusterctl generate cluster template — default (Turbo, eni) with multi-AZ
# node pools (EKS multi-node-group parity: one MachinePool per AZ).
#
# Consumed by:
#   clusterctl generate cluster <name> --kubernetes-version v1.35.0 [--worker-machine-count=N]
#
# Multi-AZ layout (EKS parity):
#   pool-0 -> VERIFY-AZ  (cn-north-4a)
#   pool-1 -> VERIFY-AZ2 (cn-north-4b)
#   pool-2 -> VERIFY-AZ7 (cn-north-4g = AZ7, has c7.large.2)
# Each pool gets ${WORKER_MACHINE_COUNT} nodes (e.g. 1 => 3 nodes across 3 AZs).
# Scale a pool with: kubectl scale machinepool <name>-pool-N --replicas=M
#
# clusterctl substitutes ${CLUSTER_NAME}, ${KUBERNETES_VERSION}, ${WORKER_MACHINE_COUNT};
# fill VERIFY-* placeholders before applying.
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: default
spec:
  clusterNetwork:
    pods:
      cidrBlocks: ["10.245.0.0/16"] # must not overlap other clusters in the same VPC
    services:
      cidrBlocks: ["10.248.0.0/16"]
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
    kind: CCECluster
    name: ${CLUSTER_NAME}
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta2
    kind: CCEManagedControlPlane
    name: ${CLUSTER_NAME}-control-plane
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: CCECluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: default
  labels:
    cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
spec:
  region: VERIFY-REGION
  network:
    vpc:
      id: VERIFY-VPC-ID
    subnets:
      - id: VERIFY-SUBNET-ID # node subnet
        availabilityZone: VERIFY-AZ
      - id: VERIFY-ENI-SUBNET-ID # Turbo ENI container subnet
        type: eni
        neutronSubnetId: VERIFY-ENI-NEUTRON-ID
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: CCEManagedControlPlane
metadata:
  name: ${CLUSTER_NAME}-control-plane
  namespace: default
  labels:
    cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
spec:
  clusterName: ${CLUSTER_NAME}
  category: Turbo
  version: ${KUBERNETES_VERSION} # full semver; provider strips patch for the CCE API
  flavor: cce.s1.small
  containerNetwork:
    mode: eni # Turbo: container CIDR comes from the ENI subnet
    eniSubnets:
      - VERIFY-ENI-NEUTRON-ID # webhook requires it; eniNetwork API uses the neutron ID
  serviceNetwork:
    cidr: 10.248.0.0/16
  endpointAccess:
    public: false
  billing:
    mode: 0
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachinePool
metadata:
  name: ${CLUSTER_NAME}-pool-0
  namespace: default
spec:
  clusterName: ${CLUSTER_NAME}
  replicas: ${WORKER_MACHINE_COUNT}
  template:
    spec:
      clusterName: ${CLUSTER_NAME}
      version: ${KUBERNETES_VERSION}
      bootstrap:
        dataSecretName: ${CLUSTER_NAME}-bootstrap
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: CCEManagedMachinePool
        name: ${CLUSTER_NAME}-pool-0
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: CCEManagedMachinePool
metadata:
  name: ${CLUSTER_NAME}-pool-0
  namespace: default
  labels:
    cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
spec:
  clusterName: ${CLUSTER_NAME}
  nodePoolName: pool-0
  flavor: VERIFY-FLAVOR # Turbo: c7.large.2 (sub-ENI quota > 0); Standard: c6.large.2
  os: Huawei Cloud EulerOS 2.0
  rootVolume:
    size: 40
    type: GPSSD
  dataVolumes:
    - size: 100
      type: GPSSD
  sshKey: VERIFY-KEYPAIR-NAME
  availabilityZone: VERIFY-AZ
  replicas: ${WORKER_MACHINE_COUNT}
  billingMode: 0
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachinePool
metadata:
  name: ${CLUSTER_NAME}-pool-1
  namespace: default
spec:
  clusterName: ${CLUSTER_NAME}
  replicas: ${WORKER_MACHINE_COUNT}
  template:
    spec:
      clusterName: ${CLUSTER_NAME}
      version: ${KUBERNETES_VERSION}
      bootstrap:
        dataSecretName: ${CLUSTER_NAME}-bootstrap
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: CCEManagedMachinePool
        name: ${CLUSTER_NAME}-pool-1
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: CCEManagedMachinePool
metadata:
  name: ${CLUSTER_NAME}-pool-1
  namespace: default
  labels:
    cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
spec:
  clusterName: ${CLUSTER_NAME}
  nodePoolName: pool-1
  flavor: VERIFY-FLAVOR
  os: Huawei Cloud EulerOS 2.0
  rootVolume:
    size: 40
    type: GPSSD
  dataVolumes:
    - size: 100
      type: GPSSD
  sshKey: VERIFY-KEYPAIR-NAME
  availabilityZone: VERIFY-AZ2
  replicas: ${WORKER_MACHINE_COUNT}
  billingMode: 0
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachinePool
metadata:
  name: ${CLUSTER_NAME}-pool-2
  namespace: default
spec:
  clusterName: ${CLUSTER_NAME}
  replicas: ${WORKER_MACHINE_COUNT}
  template:
    spec:
      clusterName: ${CLUSTER_NAME}
      version: ${KUBERNETES_VERSION}
      bootstrap:
        dataSecretName: ${CLUSTER_NAME}-bootstrap
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
        kind: CCEManagedMachinePool
        name: ${CLUSTER_NAME}-pool-2
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: CCEManagedMachinePool
metadata:
  name: ${CLUSTER_NAME}-pool-2
  namespace: default
  labels:
    cluster.x-k8s.io/cluster-name: ${CLUSTER_NAME}
spec:
  clusterName: ${CLUSTER_NAME}
  nodePoolName: pool-2
  flavor: VERIFY-FLAVOR
  os: Huawei Cloud EulerOS 2.0
  rootVolume:
    size: 40
    type: GPSSD
  dataVolumes:
    - size: 100
      type: GPSSD
  sshKey: VERIFY-KEYPAIR-NAME
  availabilityZone: VERIFY-AZ7
  replicas: ${WORKER_MACHINE_COUNT}
  billingMode: 0
