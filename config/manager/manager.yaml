apiVersion: apps/v1
kind: Deployment
metadata:
  name: capi-cce-controller-manager
  labels:
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      labels:
        control-plane: controller-manager
      annotations:
        # cert-manager injects the CA into the webhook configs; the serving
        # certificate Secret (webhook-service-cert) is signed by cert-manager.
        cert-manager.io/inject-ca-from: capi-cce-system/serving-cert
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: manager
          image: swr.cn-north-4.myhuaweicloud.com/capi_cce/cluster-api-cce-controller:latest
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
          env:
            # Global fallback credentials (per-cluster Secrets are recommended;
            # see docs/deploy or deploy/variables.md).
            - name: CLOUD_SDK_AK
              valueFrom:
                secretKeyRef:
                  name: capi-cce-credentials
                  key: accessKey
                  optional: true
            - name: CLOUD_SDK_SK
              valueFrom:
                secretKeyRef:
                  name: capi-cce-credentials
                  key: secretKey
                  optional: true
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP
            - containerPort: 9443
              name: webhook-server
              protocol: TCP
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: webhook-certs
          secret:
            secretName: webhook-service-cert
      serviceAccountName: capi-cce-controller-manager
      terminationGracePeriodSeconds: 10
