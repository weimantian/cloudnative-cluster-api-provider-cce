# Pre-configured clusterctl.yaml — all 4 providers fetch components from
# this project's GitHub release/; component images already point to public SWR.
#
# NOTE: clusterctl expects the URL form `releases/<tag>/<asset>` (NOT
# `releases/download/<tag>/<asset>` — the /download/ form is for plain HTTP
# clients like curl and makes clusterctl fail with "release not found").
providers:
  - name: "cluster-api"
    url: "https://github.com/weimantian/cloudnative-cluster-api-provider-cce/releases/v0.1.3/core-components.yaml"
    type: "CoreProvider"
  - name: "kubeadm"
    url: "https://github.com/weimantian/cloudnative-cluster-api-provider-cce/releases/v0.1.3/bootstrap-components.yaml"
    type: "BootstrapProvider"
  - name: "kubeadm"
    url: "https://github.com/weimantian/cloudnative-cluster-api-provider-cce/releases/v0.1.3/control-plane-components.yaml"
    type: "ControlPlaneProvider"
  - name: "cce"
    url: "https://github.com/weimantian/cloudnative-cluster-api-provider-cce/releases/v0.1.3/infrastructure-components.yaml"
    type: "InfrastructureProvider"
