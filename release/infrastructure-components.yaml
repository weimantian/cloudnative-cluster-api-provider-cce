    plural: cceclustertemplates
    shortNames:
    - ccect
    singular: cceclustertemplate
  scope: Namespaced
  versions:
  - name: v1beta2
    schema:
      openAPIV3Schema:
        description: |-
          CCEClusterTemplate is the Schema for the CCEClusterTemplates API
          (InfrastructureClusterTemplate).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CCEClusterTemplateSpec defines the desired state of CCEClusterTemplate.
              It wraps the CCEClusterSpec so the Cluster API topology controller can
              stamp a CCECluster from a ClusterClass (InfrastructureClusterTemplate
              contract: spec.template.spec).
            properties:
              template:
                description: |-
                  CCEClusterTemplateResource describes the data needed to create a CCECluster
                  from a template.
                properties:
                  spec:
                    description: |-
                      CCEClusterSpec defines the desired state of CCECluster.
                      CCECluster is the thin "shell" (InfrastructureCluster contract object) that
                      carries cluster-level network/region configuration. The control plane
                      implementation lives in CCEManagedControlPlane (controlplane group).
                    properties:
                      network:
                        description: |-
                          Network references the VPC/subnets the CCE cluster consumes.
                          CCE requires a VPC to exist before cluster creation.
                        properties:
                          natGateway:
                            description: |-
                              NatGateway enables managed node egress (managed mode only): a NAT
                              gateway + EIP + SNAT rule per managed subnet. Ignored in BYO mode.
                            properties:
                              eipResourceID:
                                description: EIPResourceID records the created NAT
                                  EIP ID (provider-managed).
                                type: string
                              resourceID:
                                description: ResourceID records the created NAT gateway
                                  ID (provider-managed).
                                type: string
                              spec:
                                default: "1"
                                description: 'Spec of the NAT gateway: "1" (small,
                                  default), "2", "3", "4".'
                                type: string
                            type: object
                          securityGroup:
                            description: |-
                              SecurityGroup declares a managed node security group the provider
                              creates (with the declared ingress/egress rules) in the managed VPC and
                              binds to node pools that do not specify their own securityGroups.
                              Its mere presence enables managed security group creation (mirrors
                              NatGatewaySpec). Managed mode only; ignored in BYO mode.
                            properties:
                              egress:
                                description: Egress rules applied to the security
                                  group (direction=egress).
                                items:
                                  description: |-
                                    SecurityGroupRuleSpec declares one security group rule. The direction is
                                    implied by whether the rule appears in SecurityGroupSpec.Ingress or Egress.
                                  properties:
                                    description:
                                      description: Description of the rule.
                                      type: string
                                    portRangeMax:
                                      description: PortRangeMax is the end port (inclusive,
                                        1-65535). 0 = all ports.
                                      format: int32
                                      type: integer
                                    portRangeMin:
                                      description: PortRangeMin is the start port
                                        (inclusive, 1-65535). 0 = all ports.
                                      format: int32
                                      type: integer
                                    protocol:
                                      description: |-
                                        Protocol of the rule: tcp, udp, icmp, or an IP protocol number. Empty
                                        matches all protocols.
                                      type: string
                                    remoteGroupID:
                                      description: |-
                                        RemoteGroupID is a peer security group ID. Mutually exclusive with
                                        RemoteIPPrefix.
                                      type: string
                                    remoteIPPrefix:
                                      description: |-
                                        RemoteIPPrefix is the source (ingress) / destination (egress) CIDR.
                                        Mutually exclusive with RemoteGroupID.
                                      type: string
                                  type: object
                                type: array
                              ingress:
                                description: Ingress rules applied to the security
                                  group (direction=ingress).
                                items:
                                  description: |-
                                    SecurityGroupRuleSpec declares one security group rule. The direction is
                                    implied by whether the rule appears in SecurityGroupSpec.Ingress or Egress.
                                  properties:
                                    description:
                                      description: Description of the rule.
                                      type: string
                                    portRangeMax:
                                      description: PortRangeMax is the end port (inclusive,
                                        1-65535). 0 = all ports.
                                      format: int32
                                      type: integer
                                    portRangeMin:
                                      description: PortRangeMin is the start port
                                        (inclusive, 1-65535). 0 = all ports.
                                      format: int32
                                      type: integer
                                    protocol:
                                      description: |-
                                        Protocol of the rule: tcp, udp, icmp, or an IP protocol number. Empty
                                        matches all protocols.
                                      type: string
                                    remoteGroupID:
                                      description: |-
                                        RemoteGroupID is a peer security group ID. Mutually exclusive with
                                        RemoteIPPrefix.
                                      type: string
                                    remoteIPPrefix:
                                      description: |-
                                        RemoteIPPrefix is the source (ingress) / destination (egress) CIDR.
                                        Mutually exclusive with RemoteGroupID.
                                      type: string
                                  type: object
                                type: array
                              name:
                                description: Name of the security group to create.
                                  Empty = "<clusterName>-node".
                                type: string
                              resourceID:
                                description: ResourceID records the created security
                                  group ID (provider-managed).
                                type: string
                            type: object
                          subnets:
                            description: |-
                              Subnets referenced (BYO) or created (managed) by the cluster. When
                              empty in managed mode, a default node subnet is derived from the VPC
                              CIDR.
                            items:
                              description: Subnet references an existing or to-be-created
                                subnet.
                              properties:
                                availabilityZone:
                                  description: AvailabilityZone of the subnet (only
                                    used when creating).
                                  type: string
                                cidr:
                                  description: CIDR of the subnet to create (only
                                    used when ID is empty).
                                  type: string
                                id:
                                  description: ID of an existing subnet. If set, the
                                    subnet is referenced and not managed.
                                  type: string
                                name:
                                  description: Name of the subnet to create (only
                                    used when ID is empty).
                                  type: string
                                neutronSubnetId:
                                  description: |-
                                    NeutronSubnetID records the neutron subnet ID (provider-managed; the
                                    CCE eniNetwork API requires the neutron ID, not the network ID).
                                  type: string
                                resourceID:
                                  description: ResourceID records the created subnet
                                    resource ID (provider-managed).
                                  type: string
                                type:
                                  description: |-
                                    Type of the subnet: node (default) or eni (Turbo container subnet).
                                    Managed Turbo clusters derive the ENI neutron_subnet_id from
                                    subnets of Type eni.
                                  type: string
                                vpcId:
                                  description: VPCID of the VPC the subnet belongs
                                    to (only used when creating).
                                  type: string
                              type: object
                            type: array
                          vpc:
                            description: VPC referenced (BYO) or created (managed)
                              for the cluster.
                            properties:
                              cidr:
                                description: CIDR of the VPC to create (only used
                                  when ID is empty).
                                type: string
                              description:
                                description: Description of the VPC to create.
                                type: string
                              id:
                                description: ID of an existing VPC. If set, the VPC
                                  is referenced and not managed.
                                type: string
                              name:
                                description: Name of the VPC to create (only used
                                  when ID is empty).
                                type: string
                              resourceID:
                                description: ResourceID records the created VPC resource
                                  ID (provider-managed).
                                type: string
                              tags:
                                additionalProperties:
                                  type: string
                                description: |-
                                  Tags attached to the VPC. The provider owned tag
                                  (cluster-api-provider-cce.cluster.<name>=owned) marks an existing VPC
                                  as ADOPTED (managed, including deletion) - the CAPA three-state model:
                                  vpc.id empty = create, vpc.id + owned tag = adopt, vpc.id + no tag = BYO.
                                type: object
                            type: object
                        type: object
                      region:
                        description: Region is the Huawei Cloud region (e.g. cn-north-4).
                          Required.
                        type: string
                    required:
                    - region
                    type: object
                required:
                - spec
                type: object
            required:
            - template
            type: object
        type: object
    served: true
    storage: true
