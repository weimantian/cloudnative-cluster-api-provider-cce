apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  labels:
    cluster.x-k8s.io/v1beta2: v1beta2
  name: ccemanagedcontrolplanetemplates.controlplane.cluster.x-k8s.io
spec:
  group: controlplane.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: CCEManagedControlPlaneTemplate
    listKind: CCEManagedControlPlaneTemplateList
    plural: ccemanagedcontrolplanetemplates
    shortNames:
    - ccemcpt
    singular: ccemanagedcontrolplanetemplate
  scope: Namespaced
  versions:
  - name: v1beta2
    schema:
      openAPIV3Schema:
        description: |-
          CCEManagedControlPlaneTemplate is the Schema for the
          CCEManagedControlPlaneTemplates API (ControlPlaneTemplate).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CCEManagedControlPlaneTemplateSpec defines the desired state of
              CCEManagedControlPlaneTemplate. It wraps the CCEManagedControlPlaneSpec so
              the Cluster API topology controller can stamp a CCEManagedControlPlane from
              a ClusterClass (ControlPlaneTemplate contract: spec.template.spec).
            properties:
              template:
                description: |-
                  CCEManagedControlPlaneTemplateResource describes the data needed to create a
                  CCEManagedControlPlane from a template.
                properties:
                  spec:
                    description: |-
                      CCEManagedControlPlaneSpec defines the desired state of
                      CCEManagedControlPlane. It maps to the CCE CreateCluster API (ClusterSpec):
                      category / flavor / version / containerNetwork / serviceNetwork /
                      customSan / publicAccess / agencyName / billingMode.
                    properties:
                      accessPolicies:
                        description: |-
                          AccessPolicies declare CCE access policies (the CCE equivalent of EKS
                          access entries). Declarative set: create missing, update drift, remove
                          those no longer listed.
                        items:
                          description: |-
                            AccessPolicySpec declares one CCE access policy (maps to the CCE
                            AccessPolicy API).
                          properties:
                            name:
                              description: Name of the access policy (unique within
                                the account).
                              maxLength: 56
                              pattern: ^[a-z][a-z0-9.-]*$
                              type: string
                            namespaces:
                              description: Namespaces the policy applies to (["*"]
                                = all).
                              items:
                                type: string
                              type: array
                            policyType:
                              description: PolicyType is the permission level.
                              enum:
                              - CCEClusterAdminPolicy
                              - CCEAdminPolicy
                              - CCEEditPolicy
                              - CCEViewPolicy
                              type: string
                            principalIds:
                              description: PrincipalIds are the IAM user/group/agency
                                IDs the policy applies to.
                              items:
                                type: string
                              minItems: 1
                              type: array
                            principalType:
                              description: 'PrincipalType is the IAM principal kind:
                                user, group or agency.'
                              enum:
                              - user
                              - group
                              - agency
                              type: string
                          required:
                          - name
                          - policyType
                          - principalIds
                          - principalType
                          type: object
                        type: array
                      addons:
                        description: |-
                          Addons are the CCE addon instances to manage (declarative set; the
                          controller installs missing ones, upgrades version drift, and removes
                          those no longer listed — mirrors CAPA EKS addons).
                        items:
                          description: AddonSpec declares a CCE addon to install.
                          properties:
                            name:
                              description: Name is the addon template name (e.g. "coredns",
                                "metrics-server").
                              type: string
                            version:
                              description: |-
                                Version is the addon template version (e.g. "1.0.0"); empty means the
                                latest supported by the cluster.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                      agencyName:
                        description: AgencyName used by the cluster (1.27+; empty
                          uses the system agency).
                        type: string
                      agencyTrustPolicy:
                        description: |-
                          AgencyTrustPolicy is the IAM v5 trust-policy JSON document used to
                          auto-create the trust agency (信任委托) referenced by the role identity
                          (identityRef -> CCEClusterRoleIdentity.spec.agencyName) when that agency
                          does not already exist. Mirrors CAPA auto-creating the cluster IAM role:
                          a non-empty policy + a role identity triggers EnsureAgency (List -> Create
                          when absent); an existing agency is adopted (never overwritten). When the
                          identity has no agency (controller/static identity), creation is skipped.
                          The document must declare "Version": "5.0".
                        type: string
                      authentication:
                        description: |-
                          Authentication controls the API server authentication mode (mirrors
                          CAPA EKS AccessConfig.AuthenticationMode). Default rbac;
                          authenticating_proxy delegates auth to an external proxy (requires a
                          CA + client cert + key). Immutable after creation.
                        properties:
                          authenticatingProxy:
                            description: AuthenticatingProxy config (required when
                              Mode=authenticating_proxy).
                            properties:
                              ca:
                                description: CA certificate (PEM) of the proxy.
                                type: string
                              cert:
                                description: Client certificate (PEM) signed by the
                                  CA.
                                type: string
                              privateKey:
                                description: Private key (PEM, unencrypted) matching
                                  the client certificate.
                                type: string
                            type: object
                          mode:
                            default: rbac
                            description: 'Mode: "rbac" (default) or "authenticating_proxy".'
                            enum:
                            - rbac
                            - authenticating_proxy
                            type: string
                        type: object
                      billing:
                        description: 'Billing controls billing mode: 0=on-demand,
                          1=subscription.'
                        properties:
                          mode:
                            default: 0
                            description: 'Mode: 0=on-demand, 1=subscription.'
                            enum:
                            - 0
                            - 1
                            format: int32
                            type: integer
                        type: object
                      category:
                        default: Turbo
                        description: 'Category of the CCE cluster: CCE (Standard)
                          or Turbo.'
                        enum:
                        - CCE
                        - Turbo
                        type: string
                      clusterName:
                        description: ClusterName of the owning CCE cluster.
                        type: string
                      containerNetwork:
                        description: ContainerNetwork of the cluster.
                        properties:
                          cidr:
                            description: CIDR of the container network (immutable
                              after creation for tunnel mode).
                            type: string
                          cidrs:
                            description: |-
                              CIDRs lists additional container network segments (secondary CIDR).
                              Maps to model.ContainerNetwork.Cidrs; each entry becomes a
                              model.ContainerCidr. Empty = single-CIDR cluster.
                            items:
                              type: string
                            type: array
                          eniSubnets:
                            description: ENISubnets for eni mode (Turbo).
                            items:
                              type: string
                            type: array
                          mode:
                            default: eni
                            description: 'Mode: overlay_l2 | vpc-router | eni (eni
                              implies Turbo).'
                            enum:
                            - overlay_l2
                            - vpc-router
                            - eni
                            type: string
                        type: object
                      controlPlaneEndpoint:
                        description: |-
                          ControlPlaneEndpoint is the API server endpoint (host:port) of the
                          managed control plane. It is backfilled by the controller once the CCE
                          cluster is available and is read by CAPI to populate
                          Cluster.spec.controlPlaneEndpoint — the CAPI control-plane contract
                          reads spec.controlPlaneEndpoint, not status.
                        minProperties: 1
                        properties:
                          host:
                            description: host is the hostname on which the API server
                              is serving.
                            maxLength: 512
                            minLength: 1
                            type: string
                          port:
                            description: port is the port on which the API server
                              is serving.
                            format: int32
                            maximum: 65535
                            minimum: 1
                            type: integer
                        type: object
                      customSan:
                        description: CustomSan entries for the API server certificate.
                        items:
                          type: string
                        type: array
                      enableAutopilot:
                        description: |-
                          EnableAutopilot creates an Autopilot (Serverless) cluster instead of a
                          standard CCE/Turbo cluster (maps to CCE spec.enableAutopilot). Autopilot
                          requires category Turbo and a compatible flavor (cce.autopilot.cluster).
                        type: boolean
                      encryptionConfig:
                        description: |-
                          EncryptionConfig controls etcd secret encryption (mirrors CAPA EKS
                          EncryptionConfig). Mode Default leaves etcd unencrypted; KMS enables
                          envelope encryption with a KMS key configured at the account level.
                          Immutable after creation.
                        properties:
                          mode:
                            default: Default
                            description: |-
                              Mode: "Default" (no encryption) or "KMS" (envelope encryption with a
                              KMS key configured at the account level).
                            enum:
                            - Default
                            - KMS
                            type: string
                        type: object
                      endpointAccess:
                        description: EndpointAccess controls public API server access.
                        properties:
                          cidrs:
                            description: |-
                              CIDRs is the public API server access whitelist (mapped to the CCE
                              PublicAccess.cidrs). Only sent when public access is enabled; empty
                              means the platform default ["0.0.0.0/0"]. CCE always exposes a
                              VPC-internal (private) endpoint regardless of this field.
                            items:
                              type: string
                            type: array
                          private:
                            default: true
                            description: |-
                              Private controls private (VPC-internal) API server access. CCE always
                              exposes a VPC-internal endpoint and cannot disable it (platform-managed
                              control plane), so this field defaults to true and false is rejected by
                              the webhook. It exists for CAPA parity (CAPA EndpointAccess exposes
                              public/private).
                            type: boolean
                          public:
                            description: Public enables public API server access.
                            type: boolean
                        type: object
                      flavor:
                        description: Flavor of the cluster (official enum e.g. cce.s1.small
                          ... cce.s2.xlarge).
                        type: string
                      identityRef:
                        description: |-
                          IdentityRef references a CCECluster*Identity (Controller/Static/Role).
                          Empty means the controller default identity (CLOUD_SDK_AK/SK env).
                        properties:
                          apiVersion:
                            description: API version of the referent.
                            type: string
                          fieldPath:
                            description: |-
                              If referring to a piece of an object instead of an entire object, this string
                              should contain a valid JSON/Go field access statement, such as desiredState.manifest.containers[2].
                              For example, if the object reference is to a container within a pod, this would take on a value like:
                              "spec.containers{name}" (where "name" refers to the name of the container that triggered
                              the event) or if no container name is specified "spec.containers[2]" (container with
                              index 2 in this pod). This syntax is chosen only to have some well-defined way of
                              referencing a part of an object.
                            type: string
                          kind:
                            description: |-
                              Kind of the referent.
                              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                            type: string
                          name:
                            description: |-
                              Name of the referent.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                          namespace:
                            description: |-
                              Namespace of the referent.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
                            type: string
                          resourceVersion:
                            description: |-
                              Specific resourceVersion to which this reference is made, if any.
                              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency
                            type: string
                          uid:
                            description: |-
                              UID of the referent.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#uids
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      ipv6enable:
                        description: |-
                          Ipv6Enable enables IPv6 dual-stack for the cluster (maps to CCE
                          spec.ipv6enable). Requires a VPC with IPv6 enabled; the service
                          network IPv6CIDR must be set as well.
                        type: boolean
                      logging:
                        description: |-
                          Logging configures control-plane log collection (mirrors CAPA EKS
                          Logging). Maps to CCE UpdateClusterLogConfig / ShowClusterConfig.
                        properties:
                          logs:
                            description: Logs lists the components to collect.
                            items:
                              description: ControlPlaneLogSpec declares one log collection
                                item.
                              properties:
                                enable:
                                  description: Enable turns collection on/off for
                                    this item.
                                  type: boolean
                                name:
                                  description: |-
                                    Name is the log type: kube-apiserver, kube-controller-manager,
                                    kube-scheduler, audit, or a system addon name.
                                  type: string
                                type:
                                  description: 'Type is the component type: control,
                                    audit, or system-addon.'
                                  enum:
                                  - control
                                  - audit
                                  - system-addon
                                  type: string
                              required:
                              - name
                              type: object
                            type: array
                          ttlInDays:
                            description: TTLInDays is the log retention in days (official
                              range 0-30).
                            format: int32
                            maximum: 30
                            minimum: 0
                            type: integer
                        type: object
                      podIdentityAssociations:
                        description: |-
                          PodIdentityAssociations bind Kubernetes ServiceAccounts to Huawei Cloud
                          agencies (the CCE equivalent of EKS Pod Identity). Declarative set:
                          create missing, delete removed.
                        items:
                          description: PodIdentityAssociationSpec declares a ServiceAccount
                            -> agency binding.
                          properties:
                            agencyName:
                              description: AgencyName is the Huawei Cloud agency (委托)
                                to bind.
                              type: string
                            namespace:
                              description: Namespace of the ServiceAccount (immutable
                                per association).
                              type: string
                            serviceAccount:
                              description: ServiceAccount name (one association per
                                ServiceAccount).
                              type: string
                          required:
                          - agencyName
                          - namespace
                          - serviceAccount
                          type: object
                        type: array
                      serviceNetwork:
                        description: ServiceNetwork of the cluster.
                        properties:
                          cidr:
                            description: CIDR of the service network.
                            type: string
                          ipv6CIDR:
                            description: |-
                              IPv6CIDR of the service network (required when Ipv6Enable is true).
                              Maps to model.ServiceNetwork.IPv6CIDR.
                            type: string
                        type: object
                      version:
                        description: Version of Kubernetes, e.g. "v1.30.0". Empty
                          means CCE latest.
                        type: string
                    required:
                    - clusterName
                    type: object
                required:
                - spec
                type: object
            required:
            - template
            type: object
        type: object
    served: true
    storage: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  labels:
    cluster.x-k8s.io/v1beta2: v1beta2
  name: ccemanagedmachinepools.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: CCEManagedMachinePool
    listKind: CCEManagedMachinePoolList
    plural: ccemanagedmachinepools
    singular: ccemanagedmachinepool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Cluster to which this CCEManagedMachinePool belongs
      jsonPath: .metadata.labels.cluster\.x-k8s\.io/cluster-name
      name: Cluster
      type: string
    - description: Actual node count
      jsonPath: .status.replicas
      name: Replicas
      type: integer
    - description: Node pool ready
      jsonPath: .status.ready
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta2
    schema:
      openAPIV3Schema:
        description: |-
          CCEManagedMachinePool is the Schema for the CCE node pools
          (InfrastructureMachinePool).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CCEManagedMachinePoolSpec defines the desired state of CCEManagedMachinePool.
              It maps 1:1 to a CCE node pool (NodePool). Field semantics follow the
              official CreateNodePool API (nodeTemplate / initialNodeCount / autoscaling).
            properties:
              autoscaling:
                description: |-
                  Autoscaling maps to the CCE node pool autoscaling
                  (NodePoolNodeAutoscaling). Only honored when the NodePoolAutoscaling
                  feature gate is enabled (Alpha, off by default); otherwise scaling is
                  driven solely by CAPI MachinePool replicas (questionnaire Q3, FR-2.6).
                properties:
                  enable:
                    description: Enable turns autoscaling on for the node pool.
                    type: boolean
                  maxNodeCount:
                    description: MaxNodeCount is the maximum node count when autoscaling
                      is enabled.
                    format: int32
                    type: integer
                  minNodeCount:
                    description: MinNodeCount is the minimum node count when autoscaling
                      is enabled.
                    format: int32
                    type: integer
                type: object
              availabilityZone:
                description: |-
                  AvailabilityZone of the nodes. Required by the webhook (CCE does not
                  support random AZ via API).
                type: string
              billingMode:
                description: 'BillingMode: 0=on-demand, 1=subscription.'
                enum:
                - 0
                - 1
                format: int32
                type: integer
              clusterName:
                description: ClusterName of the owning CCE cluster (matches Cluster
                  name).
                type: string
              dataVolumes:
                description: DataVolumes of the nodes (nodeTemplate.dataVolumes).
                items:
                  description: NodeVolume describes a root or data volume of a node.
                  properties:
                    size:
                      description: Size in GiB.
                      format: int32
                      minimum: 1
                      type: integer
                    type:
                      description: Type of the volume, e.g. GPSSD / SSD / SAS.
                      type: string
                  required:
                  - size
                  type: object
                type: array
              dedicatedHostId:
                description: |-
                  DedicatedHostId is the dedicated host (专属主机) ID for the nodes
                  (nodeTemplate.dedicatedHostId). Only effective for dedicated-host
                  flavors.
                type: string
              ecsGroupId:
                description: |-
                  EcsGroupId is the ECS server group ID (云服务器组) for the nodes
                  (nodeTemplate.ecsGroupId). Used to place nodes according to the group's
                  affinity/anti-affinity policy.
                type: string
              extensionScaleGroups:
                description: |-
                  ExtensionScaleGroups extends the node pool into additional availability
                  zones (CCE 扩展伸缩组). Each entry carries its own flavor and AZ; the
                  base nodeTemplate.az remains the primary AZ.
                items:
                  description: |-
                    ExtensionScaleGroupSpec describes one CCE extension scale group — an
                    additional flavor/AZ set in a multi-AZ node pool.
                  properties:
                    availabilityZone:
                      description: AvailabilityZone for this group.
                      type: string
                    flavor:
                      description: Flavor is the ECS flavor for this group.
                      type: string
                    name:
                      description: Name of the extension scale group.
                      type: string
                  required:
                  - availabilityZone
                  - flavor
                  - name
                  type: object
                type: array
              faultDomain:
                description: |-
                  FaultDomain is the fault domain (故障域) for the nodes
                  (nodeTemplate.faultDomain). Enables single-AZ multi-fault-domain
                  placement.
                type: string
              flavor:
                description: Flavor is the ECS instance flavor of the nodes (nodeTemplate.flavor).
                type: string
              labels:
                additionalProperties:
                  type: string
                description: Labels applied to the nodes.
                type: object
              nodePoolName:
                description: NodePoolName is the CCE node pool name.
                type: string
              nodeRepair:
                description: |-
                  NodeRepair enables node auto-repair (mirrors CAPA NodeRepairConfig.
                  Enabled). CCE has no EKS-style auto-repair switch, so the provider
                  detects Abnormal/Error nodes and resets them via CCE ResetNode.
                properties:
                  enabled:
                    default: false
                    description: |-
                      Enabled enables auto-repair: the provider detects Abnormal/Error nodes
                      and resets them via CCE ResetNode.
                    type: boolean
                type: object
              os:
                description: |-
                  OS image family of the nodes (nodeTemplate.os), e.g.
                  "Huawei Cloud EulerOS 2.0". Required by the webhook (official
                  CreateNodePool requires os unless a private image is used).
                type: string
              postInstall:
                description: |-
                  PostInstall is the base64-encoded script run after node installation
                  (nodeTemplate.extendParam["alpha.cce/postInstall"]). Mirrors the CCE
                  node lifecycle postInstall hook; the value must already be base64-
                  encoded.
                type: string
              preInstall:
                description: |-
                  PreInstall is the base64-encoded script run before node installation
                  (nodeTemplate.extendParam["alpha.cce/preInstall"]). Mirrors the CCE node
                  lifecycle preInstall hook; the value must already be base64-encoded.
                type: string
              providerIDList:
                description: |-
                  ProviderIDList is the list of provider IDs of the nodes in the pool,
                  populated by the controller so Cluster API can fill
                  MachinePool.status.nodeRefs (and the deprecated readyReplicas). Each
                  entry has the form huaweicloud:///<serverId>, matching the
                  spec.providerID of the corresponding workload node. The controller owns
                  this field.
                items:
                  type: string
                type: array
              replicas:
                description: |-
                  Replicas is the desired node count (maps to the node pool expected count).
                  It is normally driven by the owning MachinePool.spec.replicas.
                format: int32
                type: integer
              rootVolume:
                description: |-
                  RootVolume of the nodes (nodeTemplate.rootVolume). Pointer so an empty
                  value is omitted; required by the webhook (size 40-1024 GiB).
                properties:
                  size:
                    description: Size in GiB.
                    format: int32
                    minimum: 1
                    type: integer
                  type:
                    description: Type of the volume, e.g. GPSSD / SSD / SAS.
                    type: string
                required:
                - size
                type: object
              securityGroups:
                description: |-
                  SecurityGroups to bind to the node pool (Turbo >= 1.21, max 5 per
                  official constraint).
                items:
                  type: string
                maxItems: 5
                type: array
              spot:
                description: |-
                  Spot requests spot (竞价) instances for the node pool. Only effective
                  when billingMode=0 (on-demand); maps to nodeTemplate.extendParam.
                  marketType=spot.
                type: boolean
              spotPrice:
                description: |-
                  SpotPrice is the maximum hourly price the user is willing to pay for
                  spot instances. Empty = the on-demand price is used as the spot price.
                  Only effective when spot is set and billingMode=0.
                type: string
              sshKey:
                description: SSHKey used to access the nodes (nodeTemplate.sshKey).
                type: string
              taints:
                description: Taints applied to the nodes (max 20 per official constraint).
                items:
                  type: string
                maxItems: 20
                type: array
              updateConfig:
                description: |-
                  UpdateConfig controls how spec changes are rolled onto existing nodes
                  (CCE 同步节点池 UpgradeNodePool, the analogue of CAPA's UpdateConfig /
                  rolling update). Node attributes such as securityGroups, taints, labels
                  and OS only apply to newly created nodes, so the controller calls
                  UpgradeNodePool to synchronise them onto running nodes.
                properties:
                  maxUnavailable:
                    description: |-
                      MaxUnavailable is the maximum number of nodes made unavailable per
                      rolling batch (official range [1,20]; default 1).
                    format: int32
                    maximum: 20
                    minimum: 1
                    type: integer
                type: object
              waitPostInstallFinish:
                description: |-
                  WaitPostInstallFinish blocks pod scheduling until the post-install
                  script finishes (nodeTemplate.waitPostInstallFinish). Mirrors CCE's
                  NodeLifecycleConfig waitPostInstallFinish.
                type: boolean
            required:
            - clusterName
            - flavor
            - nodePoolName
            type: object
          status:
            description: CCEManagedMachinePoolStatus defines the observed state of
              CCEManagedMachinePool.
            properties:
              availableReplicas:
                description: AvailableReplicas is the number of nodes in Active state.
                format: int32
                type: integer
              conditions:
                description: Conditions defines current service state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastAppliedAutoscaling:
                description: |-
                  LastAppliedAutoscaling records the autoscaling config last synced to the
                  cloud node pool (only meaningful when the NodePoolAutoscaling gate is
                  on). Mirrors spec.autoscaling for drift detection.
                properties:
                  enable:
                    description: Enable turns autoscaling on for the node pool.
                    type: boolean
                  maxNodeCount:
                    description: MaxNodeCount is the maximum node count when autoscaling
                      is enabled.
                    format: int32
                    type: integer
                  minNodeCount:
                    description: MinNodeCount is the minimum node count when autoscaling
                      is enabled.
                    format: int32
                    type: integer
                type: object
              lastAppliedSecurityGroups:
                description: |-
                  LastAppliedSecurityGroups records the security groups last synced to the
                  cloud node pool. Used to detect attribute drift so the controller only
                  issues an UpdateNodePool when needed (and never rescales the pool just
                  because an attribute changed — questionnaire Q3/Q5).
                items:
                  type: string
                type: array
              nodePoolID:
                description: NodePoolID is the CCE node pool UUID.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the latest generation observed by the controller.
                  Used to prevent missed spec changes when controller-runtime event coalescing
                  causes a status patch and an external spec patch to land in the same work
                  queue window. Matches CAPA v2.13.0 commits 9e9bb6b31 / b5d6d3081 (applied
                  to CCEManagedControlPlane; same pattern extended to CCEManagedMachinePool
                  because machine pools can also miss spec changes during long reconciles).
                format: int64
                type: integer
              ready:
                description: Ready indicates the node pool is ready.
                type: boolean
              replicas:
                description: Replicas is the actual number of nodes (consumed by CAPI
                  MachinePool).
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  labels:
    cluster.x-k8s.io/v1beta2: v1beta2
  name: ccemanagedmachinepooltemplates.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: CCEManagedMachinePoolTemplate
    listKind: CCEManagedMachinePoolTemplateList
    plural: ccemanagedmachinepooltemplates
    shortNames:
    - ccemmpt
    singular: ccemanagedmachinepooltemplate
  scope: Namespaced
  versions:
  - name: v1beta2
    schema:
      openAPIV3Schema:
        description: |-
          CCEManagedMachinePoolTemplate is the Schema for the
          CCEManagedMachinePoolTemplates API (InfrastructureMachinePoolTemplate).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CCEManagedMachinePoolTemplateSpec defines the desired state of
              CCEManagedMachinePoolTemplate. It wraps the CCEManagedMachinePoolSpec so the
              Cluster API topology controller can stamp a CCEManagedMachinePool from a
              ClusterClass MachinePoolClass (InfrastructureMachinePoolTemplate contract:
              spec.template.spec).
            properties:
              template:
                description: |-
                  CCEManagedMachinePoolTemplateResource describes the data needed to create a
                  CCEManagedMachinePool from a template.
                properties:
                  spec:
                    description: |-
                      CCEManagedMachinePoolSpec defines the desired state of CCEManagedMachinePool.
                      It maps 1:1 to a CCE node pool (NodePool). Field semantics follow the
                      official CreateNodePool API (nodeTemplate / initialNodeCount / autoscaling).
                    properties:
                      autoscaling:
                        description: |-
                          Autoscaling maps to the CCE node pool autoscaling
                          (NodePoolNodeAutoscaling). Only honored when the NodePoolAutoscaling
                          feature gate is enabled (Alpha, off by default); otherwise scaling is
                          driven solely by CAPI MachinePool replicas (questionnaire Q3, FR-2.6).
                        properties:
                          enable:
                            description: Enable turns autoscaling on for the node
                              pool.
                            type: boolean
                          maxNodeCount:
                            description: MaxNodeCount is the maximum node count when
                              autoscaling is enabled.
                            format: int32
                            type: integer
                          minNodeCount:
                            description: MinNodeCount is the minimum node count when
                              autoscaling is enabled.
                            format: int32
                            type: integer
                        type: object
                      availabilityZone:
                        description: |-
                          AvailabilityZone of the nodes. Required by the webhook (CCE does not
                          support random AZ via API).
                        type: string
                      billingMode:
                        description: 'BillingMode: 0=on-demand, 1=subscription.'
                        enum:
                        - 0
                        - 1
                        format: int32
                        type: integer
                      clusterName:
                        description: ClusterName of the owning CCE cluster (matches
                          Cluster name).
                        type: string
                      dataVolumes:
                        description: DataVolumes of the nodes (nodeTemplate.dataVolumes).
                        items:
                          description: NodeVolume describes a root or data volume
                            of a node.
                          properties:
                            size:
                              description: Size in GiB.
                              format: int32
                              minimum: 1
                              type: integer
                            type:
                              description: Type of the volume, e.g. GPSSD / SSD /
                                SAS.
                              type: string
                          required:
                          - size
                          type: object
                        type: array
                      dedicatedHostId:
                        description: |-
                          DedicatedHostId is the dedicated host (专属主机) ID for the nodes
                          (nodeTemplate.dedicatedHostId). Only effective for dedicated-host
                          flavors.
                        type: string
                      ecsGroupId:
                        description: |-
                          EcsGroupId is the ECS server group ID (云服务器组) for the nodes
                          (nodeTemplate.ecsGroupId). Used to place nodes according to the group's
                          affinity/anti-affinity policy.
                        type: string
                      extensionScaleGroups:
                        description: |-
                          ExtensionScaleGroups extends the node pool into additional availability
                          zones (CCE 扩展伸缩组). Each entry carries its own flavor and AZ; the
                          base nodeTemplate.az remains the primary AZ.
                        items:
                          description: |-
                            ExtensionScaleGroupSpec describes one CCE extension scale group — an
                            additional flavor/AZ set in a multi-AZ node pool.
                          properties:
                            availabilityZone:
                              description: AvailabilityZone for this group.
                              type: string
                            flavor:
                              description: Flavor is the ECS flavor for this group.
                              type: string
                            name:
                              description: Name of the extension scale group.
                              type: string
                          required:
                          - availabilityZone
                          - flavor
                          - name
                          type: object
                        type: array
                      faultDomain:
                        description: |-
                          FaultDomain is the fault domain (故障域) for the nodes
                          (nodeTemplate.faultDomain). Enables single-AZ multi-fault-domain
                          placement.
                        type: string
                      flavor:
                        description: Flavor is the ECS instance flavor of the nodes
                          (nodeTemplate.flavor).
                        type: string
                      labels:
                        additionalProperties:
                          type: string
                        description: Labels applied to the nodes.
                        type: object
                      nodePoolName:
                        description: NodePoolName is the CCE node pool name.
                        type: string
                      nodeRepair:
                        description: |-
                          NodeRepair enables node auto-repair (mirrors CAPA NodeRepairConfig.
                          Enabled). CCE has no EKS-style auto-repair switch, so the provider
                          detects Abnormal/Error nodes and resets them via CCE ResetNode.
                        properties:
                          enabled:
                            default: false
                            description: |-
                              Enabled enables auto-repair: the provider detects Abnormal/Error nodes
                              and resets them via CCE ResetNode.
                            type: boolean
                        type: object
                      os:
                        description: |-
                          OS image family of the nodes (nodeTemplate.os), e.g.
                          "Huawei Cloud EulerOS 2.0". Required by the webhook (official
                          CreateNodePool requires os unless a private image is used).
                        type: string
                      postInstall:
                        description: |-
                          PostInstall is the base64-encoded script run after node installation
                          (nodeTemplate.extendParam["alpha.cce/postInstall"]). Mirrors the CCE
                          node lifecycle postInstall hook; the value must already be base64-
                          encoded.
                        type: string
                      preInstall:
                        description: |-
                          PreInstall is the base64-encoded script run before node installation
                          (nodeTemplate.extendParam["alpha.cce/preInstall"]). Mirrors the CCE node
                          lifecycle preInstall hook; the value must already be base64-encoded.
                        type: string
                      providerIDList:
                        description: |-
                          ProviderIDList is the list of provider IDs of the nodes in the pool,
                          populated by the controller so Cluster API can fill
                          MachinePool.status.nodeRefs (and the deprecated readyReplicas). Each
                          entry has the form huaweicloud:///<serverId>, matching the
                          spec.providerID of the corresponding workload node. The controller owns
                          this field.
                        items:
                          type: string
                        type: array
                      replicas:
                        description: |-
                          Replicas is the desired node count (maps to the node pool expected count).
                          It is normally driven by the owning MachinePool.spec.replicas.
                        format: int32
                        type: integer
                      rootVolume:
                        description: |-
                          RootVolume of the nodes (nodeTemplate.rootVolume). Pointer so an empty
                          value is omitted; required by the webhook (size 40-1024 GiB).
                        properties:
                          size:
                            description: Size in GiB.
                            format: int32
                            minimum: 1
                            type: integer
                          type:
                            description: Type of the volume, e.g. GPSSD / SSD / SAS.
                            type: string
                        required:
                        - size
                        type: object
                      securityGroups:
                        description: |-
                          SecurityGroups to bind to the node pool (Turbo >= 1.21, max 5 per
                          official constraint).
                        items:
                          type: string
                        maxItems: 5
                        type: array
                      spot:
                        description: |-
                          Spot requests spot (竞价) instances for the node pool. Only effective
                          when billingMode=0 (on-demand); maps to nodeTemplate.extendParam.
                          marketType=spot.
                        type: boolean
                      spotPrice:
                        description: |-
                          SpotPrice is the maximum hourly price the user is willing to pay for
                          spot instances. Empty = the on-demand price is used as the spot price.
                          Only effective when spot is set and billingMode=0.
                        type: string
                      sshKey:
                        description: SSHKey used to access the nodes (nodeTemplate.sshKey).
                        type: string
                      taints:
                        description: Taints applied to the nodes (max 20 per official
                          constraint).
                        items:
                          type: string
                        maxItems: 20
                        type: array
                      updateConfig:
                        description: |-
                          UpdateConfig controls how spec changes are rolled onto existing nodes
                          (CCE 同步节点池 UpgradeNodePool, the analogue of CAPA's UpdateConfig /
                          rolling update). Node attributes such as securityGroups, taints, labels
                          and OS only apply to newly created nodes, so the controller calls
                          UpgradeNodePool to synchronise them onto running nodes.
                        properties:
                          maxUnavailable:
                            description: |-
                              MaxUnavailable is the maximum number of nodes made unavailable per
                              rolling batch (official range [1,20]; default 1).
                            format: int32
                            maximum: 20
                            minimum: 1
                            type: integer
                        type: object
                      waitPostInstallFinish:
                        description: |-
                          WaitPostInstallFinish blocks pod scheduling until the post-install
                          script finishes (nodeTemplate.waitPostInstallFinish). Mirrors CCE's
                          NodeLifecycleConfig waitPostInstallFinish.
                        type: boolean
                    required:
                    - clusterName
                    - flavor
                    - nodePoolName
                    type: object
                required:
                - spec
                type: object
            required:
            - template
            type: object
        type: object
    served: true
    storage: true
