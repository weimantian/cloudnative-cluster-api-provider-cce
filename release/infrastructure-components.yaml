apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  labels:
    cluster.x-k8s.io/v1beta2: v1beta2
  name: cceclusters.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: CCECluster
    listKind: CCEClusterList
    plural: cceclusters
    singular: ccecluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Cluster to which this CCECluster belongs
      jsonPath: .metadata.labels.cluster\.x-k8s\.io/cluster-name
      name: Cluster
      type: string
    - description: CCECluster is ready
      jsonPath: .status.ready
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta2
    schema:
      openAPIV3Schema:
        description: CCECluster is the Schema for the CCE clusters (InfrastructureCluster).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CCEClusterSpec defines the desired state of CCECluster.
              CCECluster is the thin "shell" (InfrastructureCluster contract object) that
              carries cluster-level network/region configuration. The control plane
              implementation lives in CCEManagedControlPlane (controlplane group).
            properties:
              network:
                description: |-
                  Network references the VPC/subnets the CCE cluster consumes.
                  CCE requires a VPC to exist before cluster creation.
                properties:
                  natGateway:
                    description: |-
                      NatGateway enables managed node egress (managed mode only): a NAT
                      gateway + EIP + SNAT rule per managed subnet. Ignored in BYO mode.
                    properties:
                      eipResourceID:
                        description: EIPResourceID records the created NAT EIP ID
                          (provider-managed).
                        type: string
                      resourceID:
                        description: ResourceID records the created NAT gateway ID
                          (provider-managed).
                        type: string
                      spec:
                        default: "1"
                        description: 'Spec of the NAT gateway: "1" (small, default),
                          "2", "3", "4".'
                        type: string
                    type: object
                  securityGroup:
                    description: |-
                      SecurityGroup declares a managed node security group the provider
                      creates (with the declared ingress/egress rules) in the managed VPC and
                      binds to node pools that do not specify their own securityGroups.
                      Its mere presence enables managed security group creation (mirrors
                      NatGatewaySpec). Managed mode only; ignored in BYO mode.
                    properties:
                      egress:
                        description: Egress rules applied to the security group (direction=egress).
                        items:
                          description: |-
                            SecurityGroupRuleSpec declares one security group rule. The direction is
                            implied by whether the rule appears in SecurityGroupSpec.Ingress or Egress.
                          properties:
                            description:
                              description: Description of the rule.
                              type: string
                            portRangeMax:
                              description: PortRangeMax is the end port (inclusive,
                                1-65535). 0 = all ports.
                              format: int32
                              type: integer
                            portRangeMin:
                              description: PortRangeMin is the start port (inclusive,
                                1-65535). 0 = all ports.
                              format: int32
                              type: integer
                            protocol:
                              description: |-
                                Protocol of the rule: tcp, udp, icmp, or an IP protocol number. Empty
                                matches all protocols.
                              type: string
                            remoteGroupID:
                              description: |-
                                RemoteGroupID is a peer security group ID. Mutually exclusive with
                                RemoteIPPrefix.
                              type: string
                            remoteIPPrefix:
                              description: |-
                                RemoteIPPrefix is the source (ingress) / destination (egress) CIDR.
                                Mutually exclusive with RemoteGroupID.
                              type: string
                          type: object
                        type: array
                      ingress:
                        description: Ingress rules applied to the security group (direction=ingress).
                        items:
                          description: |-
                            SecurityGroupRuleSpec declares one security group rule. The direction is
                            implied by whether the rule appears in SecurityGroupSpec.Ingress or Egress.
                          properties:
                            description:
                              description: Description of the rule.
                              type: string
                            portRangeMax:
                              description: PortRangeMax is the end port (inclusive,
                                1-65535). 0 = all ports.
                              format: int32
                              type: integer
                            portRangeMin:
                              description: PortRangeMin is the start port (inclusive,
                                1-65535). 0 = all ports.
                              format: int32
                              type: integer
                            protocol:
                              description: |-
                                Protocol of the rule: tcp, udp, icmp, or an IP protocol number. Empty
                                matches all protocols.
                              type: string
                            remoteGroupID:
                              description: |-
                                RemoteGroupID is a peer security group ID. Mutually exclusive with
                                RemoteIPPrefix.
                              type: string
                            remoteIPPrefix:
                              description: |-
                                RemoteIPPrefix is the source (ingress) / destination (egress) CIDR.
                                Mutually exclusive with RemoteGroupID.
                              type: string
                          type: object
                        type: array
                      name:
                        description: Name of the security group to create. Empty =
                          "<clusterName>-node".
                        type: string
                      resourceID:
                        description: ResourceID records the created security group
                          ID (provider-managed).
                        type: string
                    type: object
                  subnets:
                    description: |-
                      Subnets referenced (BYO) or created (managed) by the cluster. When
                      empty in managed mode, a default node subnet is derived from the VPC
                      CIDR.
                    items:
                      description: Subnet references an existing or to-be-created
                        subnet.
                      properties:
                        availabilityZone:
                          description: AvailabilityZone of the subnet (only used when
                            creating).
                          type: string
                        cidr:
                          description: CIDR of the subnet to create (only used when
                            ID is empty).
                          type: string
                        id:
                          description: ID of an existing subnet. If set, the subnet
                            is referenced and not managed.
                          type: string
                        name:
                          description: Name of the subnet to create (only used when
                            ID is empty).
                          type: string
                        neutronSubnetId:
                          description: |-
                            NeutronSubnetID records the neutron subnet ID (provider-managed; the
                            CCE eniNetwork API requires the neutron ID, not the network ID).
                          type: string
                        resourceID:
                          description: ResourceID records the created subnet resource
                            ID (provider-managed).
                          type: string
                        type:
                          description: |-
                            Type of the subnet: node (default) or eni (Turbo container subnet).
                            Managed Turbo clusters derive the ENI neutron_subnet_id from
                            subnets of Type eni.
                          type: string
                        vpcId:
                          description: VPCID of the VPC the subnet belongs to (only
                            used when creating).
                          type: string
                      type: object
                    type: array
                  vpc:
                    description: VPC referenced (BYO) or created (managed) for the
                      cluster.
                    properties:
                      cidr:
                        description: CIDR of the VPC to create (only used when ID
                          is empty).
                        type: string
                      description:
                        description: Description of the VPC to create.
                        type: string
                      id:
                        description: ID of an existing VPC. If set, the VPC is referenced
                          and not managed.
                        type: string
                      name:
                        description: Name of the VPC to create (only used when ID
                          is empty).
                        type: string
                      resourceID:
                        description: ResourceID records the created VPC resource ID
                          (provider-managed).
                        type: string
                      tags:
                        additionalProperties:
                          type: string
                        description: |-
                          Tags attached to the VPC. The provider owned tag
                          (cluster-api-provider-cce.cluster.<name>=owned) marks an existing VPC
                          as ADOPTED (managed, including deletion) - the CAPA three-state model:
                          vpc.id empty = create, vpc.id + owned tag = adopt, vpc.id + no tag = BYO.
                        type: object
                    type: object
                type: object
              region:
                description: Region is the Huawei Cloud region (e.g. cn-north-4).
                  Required.
                type: string
            required:
            - region
            type: object
          status:
            description: |-
              CCEClusterStatus defines the observed state of CCECluster. Two distinct
              readiness flags (P2-11 audit): Ready is cloud-side readiness, consumed
              by CAPI core to flip Cluster.Status.InfrastructureReady;
              Initialization.Provisioned is the CAPI v1beta2 contract path that the
              CAPI Cluster controller gates Cluster.Status.Initialization.
              InfrastructureProvisioned on. The two must not be conflated.
            properties:
              clusterID:
                description: |-
                  ClusterID is the CCE cluster UUID (backfilled by the control plane
                  controller).
                type: string
              conditions:
                description: Conditions defines current service state of the CCECluster.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              initialization:
                description: |-
                  Initialization reports infrastructure provisioning state. Provisioned
                  mirrors the CAPI InfrastructureCluster contract path
                  status.initialization.provisioned, which the CAPI Cluster controller
                  gates Cluster.Status.Initialization.InfrastructureProvisioned on.
                properties:
                  provisioned:
                    description: Provisioned indicates the infrastructure is provisioned
                      (CAPI contract).
                    type: boolean
                type: object
              ready:
                description: |-
                  Ready indicates the cluster infrastructure (network validation) is
                  complete; consumed by CAPI core to flip Cluster.Status.InfrastructureReady.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
