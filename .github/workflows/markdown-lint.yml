name: Markdown Lint

on:
  pull_request:
    paths: ['**/*.md']
  push:
    branches: [main]
    paths: ['**/*.md']

permissions:
  contents: read

jobs:
  markdownlint:
    name: Lint Markdown files
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: |
            '*.md'
            'docs/**/*.md'
            '.github/**/*.md'
          config: |
            {
              "MD013": { "line_length": 200 },
              "MD033": false,
              "MD041": false
            }
