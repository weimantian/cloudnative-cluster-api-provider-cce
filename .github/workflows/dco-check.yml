name: DCO Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: Verify Signed-off-by
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify all commits are DCO-signed
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD~1' }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${BASE_REF}...HEAD"
          else
            range="HEAD~1...HEAD"
          fi
          bad=0
          while read -r commit; do
            [ -z "$commit" ] && continue
            if ! git log -1 --format='%B' "$commit" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $commit is missing a 'Signed-off-by:' trailer (use 'git commit -s')"
              bad=1
            fi
          done < <(git rev-list "$range")
          exit "$bad"
